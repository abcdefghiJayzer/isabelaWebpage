<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
    />
    <link rel="stylesheet" href="css/footer.css" />
    <link rel="stylesheet" href="css/navbar.css" />
    <link rel="stylesheet" href="css/about.css" />
  </head>
  <body>
    <header>
      <nav>
        <div class="nav-logo logo">
          <img
            src="asset/icon/sakaybayanlogo.png"
            alt="Sakay Bayan Logo"
            class="logo-img"
          />
        </div>
        <ul class="nav-menu" id="nav-menu">
          <li><a href="#">Home</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Issues & Solution</a></li>
          <li><a href="#">News</a></li>
          <li><a href="#">Take Action</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
        <div class="menu-toggle" id="menu-toggle">☰</div>
      </nav>
    </header>


    

    <footer>
      <div class="footer-logo">
        <img
          src="asset/icon/sakaybayanlogo.png"
          alt="Sakay Bayan Logo"
          class="logo-img"
        />
      </div>
      <div class="footer-container">
        <nav class="footer-nav">
          <a href="#">HOME</a>
          <a href="#">ABOUT</a>
          <a href="#">ISSUES & SOLUTIONS</a>
          <a href="#">NEWS</a>
          <a href="#">TAKE ACTION</a>
          <a href="#">CONTACT</a>
        </nav>
      </div>

      <div class="footer-socials">
        <div class="socmed">
          <img src="asset/icon/ig.png" alt="Instagram" class="w-6 h-6" />
        </div>
        <div class="socmed">
          <img src="asset/icon/twitter.png" alt="Twitter" class="w-6 h-6" />
        </div>
        <div class="socmed">
          <img src="asset/icon/yt.png" alt="YouTube" class="w-6 h-6" />
        </div>
        <div class="socmed">
          <img src="asset/icon/fb.png" alt="Facebook" class="w-6 h-6" />
        </div>
        <div class="socmed">
          <img src="asset/icon/email.png" alt="Threads" class="w-6 h-6" />
        </div>
      </div>

      <hr class="footer-divider" />
      <div class="footer-below">
        <div class="footer-copyright">
          <p>&copy; 2025 Isabela Caballero. All rights reserved.</p>
        </div>
        <div class="footer-acknowledgement">
          <a href="#">Acknowledgement</a>
        </div>
      </div>
    </footer>

    <script>
      const menuToggle = document.getElementById("menu-toggle");
      const navMenu = document.getElementById("nav-menu");

      menuToggle.addEventListener("click", () => {
        navMenu.classList.toggle("show");
      });
    </script>
  </body>
</html>
